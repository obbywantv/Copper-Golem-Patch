name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Compile + tests contre chaque version de la matrice. Le but n'est pas de
  # produire cinq artefacts, mais de detecter tout de suite si une version
  # recente de l'API Paper casse le source (signature changee, API retiree).
  compatibility:
    name: MC ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.9', '1.21.10', '1.21.11', '26.1.2', '26.2']
    steps:
      - uses: actions/checkout@v4

      # JDK 25 meme pour cibler du bytecode 21 : lire les jars paper-api 26.x
      # (class file 69) l'exige.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build + tests
        run: ./gradlew build -PmcVersion=${{ matrix.minecraft }}

      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.minecraft }}
          path: build/reports/tests/test

  # L'artefact distribuable : compile contre le plancher, donc bytecode Java
  # 21, donc chargeable sur toute la plage 1.21.9 -> 26.2.
  artifact:
    name: Jar distribuable
    runs-on: ubuntu-latest
    needs: compatibility
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build plancher
        run: ./gradlew build

      - name: Verifier que le bytecode est bien du Java 21
        run: |
          jar=$(ls build/libs/*.jar)
          unzip -o -q "$jar" -d /tmp/cgp
          major=$(javap -verbose -cp /tmp/cgp dev.cgp.coppergolempatch.CopperGolemPatchPlugin \
                  | grep -m1 'major version' | tr -dc '0-9')
          echo "class file major version = $major"
          if [ "$major" != "65" ]; then
            echo "::error::Bytecode $major au lieu de 65 (Java 21) - le jar ne chargerait pas sur 1.21.9-1.21.11"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CopperGolemPatch
          path: build/libs/*.jar
