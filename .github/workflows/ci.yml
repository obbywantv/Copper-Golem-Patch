name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Compile + test against every version in the matrix. The point is not to
  # produce five artifacts, but to catch straight away if a recent Paper API
  # breaks the source (changed signature, removed API).
  compatibility:
    # NOTE: this job name becomes a required status check name in the branch
    # ruleset. Renaming it silently invalidates that requirement.
    name: MC ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.9', '1.21.10', '1.21.11', '26.1.2', '26.2']
    steps:
      - uses: actions/checkout@v4

      # JDK 25 even when targeting Java 21 bytecode: reading the paper-api
      # 26.x jars (class file 69) requires it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build + tests
        run: ./gradlew build -PmcVersion=${{ matrix.minecraft }}

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.minecraft }}
          path: build/reports/tests/test

  # The distributable artifact: built against the floor, hence Java 21
  # bytecode, hence loadable across the whole 1.21.9 -> 26.2 range.
  artifact:
    # NOTE: see the naming warning on the job above.
    name: Jar distribuable
    runs-on: ubuntu-latest
    needs: compatibility
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build against the floor version
        run: ./gradlew build

      - name: Check the bytecode really is Java 21
        run: |
          jar=$(ls build/libs/*.jar)
          unzip -o -q "$jar" -d /tmp/cgp
          major=$(javap -verbose -cp /tmp/cgp dev.cgp.coppergolempatch.CopperGolemPatchPlugin \
                  | grep -m1 'major version' | tr -dc '0-9')
          echo "class file major version = $major"
          if [ "$major" != "65" ]; then
            echo "::error::Bytecode $major instead of 65 (Java 21) - the jar would not load on 1.21.9-1.21.11"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CopperGolemPatch
          path: build/libs/*.jar
