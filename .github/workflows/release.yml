name: Release

# Triggered by a version tag: git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      # Revalidate the whole matrix before publishing: a release must never go
      # out while one of the supported versions no longer compiles.
      - name: Verify the full matrix
        run: |
          for v in 1.21.9 1.21.10 1.21.11 26.1.2 26.2 26.3; do
            echo "::group::MC $v"
            ./gradlew build -PmcVersion=$v || exit 1
            echo "::endgroup::"
          done

      - name: Build the floor artifact
        run: ./gradlew clean build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" build/libs/*.jar \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --notes "Compatible with Minecraft 1.21.9 -> 26.3 (Paper). Requires Java 21 or newer."
