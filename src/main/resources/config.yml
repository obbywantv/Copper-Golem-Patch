# ======================================================================
#  Copper Golem Patch - Configuration
# ======================================================================
# Defaults are fine for most servers. Change a value only if you know
# you need different behaviour.
#
# After editing: /cgp reload
# ======================================================================

# ----------------------------------------------------------------------
# DO NOT CHANGE — used by the plugin to detect outdated config files.
# If this number is missing or older than the plugin expects, your file
# is backed up and replaced with a fresh one from the jar.
# ----------------------------------------------------------------------
config_version: 1

# Master switch for the whole plugin.
# Does: true = memory, gossip, give-up, and (if enabled below) item-frame
#   labels all run. false = golems behave like vanilla again.
# Does not: uninstall the plugin or delete golem memory already stored.
enabled: true

# ----------------------------------------------------------------------
# Gossip — golems sharing knowledge when they pass each other
# ----------------------------------------------------------------------
gossip:
  # Does: when two golems are close, they copy each other's chest memory
  #   and "unplaceable" marks so the swarm learns faster.
  # Does not: create a server-wide shared database; only nearby pairs share.
  enabled: true

  # Does: sets how close (in blocks) two golems must be to share.
  # Does not: change how far a golem walks to find a chest.
  radius: 12.0

  # Does: how often (in ticks; 20 ticks = 1 second) the plugin checks
  #   whether golems are close enough to share.
  # Does not: change vanilla golem movement speed or search timing.
  interval-ticks: 30

# ----------------------------------------------------------------------
# Memory — what each golem remembers about chests
# ----------------------------------------------------------------------
memory:
  # Does: caps how many different chests one golem remembers. Oldest
  #   entries are forgotten first when the cap is hit.
  # Does not: limit how many chests exist in your world.
  max-entries-per-golem: 32

  # Does: after this many seconds without revisiting a chest, that
  #   memory entry expires (1800 = 30 minutes).
  # Does not: delete items from chests or reset vanilla golem AI.
  entry-ttl-seconds: 1800

# ----------------------------------------------------------------------
# Give-up — when an item has nowhere to be deposited
# ----------------------------------------------------------------------
# If a golem holds an item and no known storage chest will take it, it
# puts the item back in a copper chest, marks that type briefly, and
# tries something else.
give-up:
  # Does: safety cap — give up after this many distinct chest rejections
  #   even if the search is still going (large farms).
  # Does not: change the normal "finished searching" give-up; that still
  #   happens on its own when the search goes quiet.
  after-rejections: 50

  # Does: how long (seconds) a type stays marked "can't place right now"
  #   before the golem retries. Keep this short so new empty chests are
  #   noticed quickly.
  # Does not: permanently ban an item type from being sorted.
  unplaceable-ttl-seconds: 20

# ----------------------------------------------------------------------
# Item-frame labels — optional deposit filter on storage chests
# ----------------------------------------------------------------------
# Only applies to Chest / Trapped Chest that have an item frame (regular
# or glowing, visible or invisible) attached to the chest (or the other
# half of a double chest) AND that frame holds an item.
item-frame-labels:
  # Does (when true AND a frame+item is attached):
  #   - that chest accepts only that item TYPE (dura/enchants ignored)
  #   - an empty labeled chest does NOT accept other types
  # Does not:
  #   - change chests with no frame, or with an empty frame (those stay
  #     fully vanilla: empty = any item, or same type already inside)
  #   - match by name, lore, enchants, or durability — type only
  #   - apply when this option is false (vanilla empty-chest rules again)
  enabled: true
