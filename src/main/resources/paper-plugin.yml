name: CopperGolemPatch
version: '${version}'
main: dev.cgp.coppergolempatch.CopperGolemPatchPlugin
api-version: '${apiVersion}'
author: Craftekture
description: Gives Copper Golems a persistent memory of which chests hold what, and lets them share that knowledge with nearby golems so they stop re-checking chests they already know are wrong.
permissions:
  coppergolempatch.admin:
    description: Allows managing Copper Golem Patch
    default: op
